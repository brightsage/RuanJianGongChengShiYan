server.port=8080

spring.application.name=demo1

# ---------------- 数据源 ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/ruanjianshiyan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# ---------------- MyBatis ----------------
mybatis.configuration.map-underscore-to-camel-case=true
# 需要看 SQL 就把下面这行改成 StdOutImpl（或把 mapper 日志级别调到 debug）
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis.mapper-locations=classpath:mapper/*.xml

logging.level.com.example.demo=info
# 调成 debug 可查看 mapper 的 SQL 与参数
logging.level.com.example.demo.mapper=info
logging.level.org.springframework.jdbc.support.JdbcTransactionManager=debug

# ---------------- 数据中台自身参数 ----------------
# 当前画像计算周期
sgp.period=2025-2026
# JWT 密钥与有效期（教学演示用，生产应放环境变量/密钥管理）
sgp.jwt.secret=sgp-student-growth-platform-2026-demo-secret
sgp.jwt.expire-hours=12
# 首次启动时若派生数据为空，自动计算画像/预警/推荐
sgp.demo-init=true
