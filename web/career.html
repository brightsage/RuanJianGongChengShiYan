<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职业发展推荐 · 学生成长中台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/career.js" defer></script>
</head>
<body>
  <header>
    <h1>职业发展推荐</h1>
    <p id="career-mode">正在连接平台…</p>
  </header>
  <main class="career">
    <nav class="career-actions"><a href="/">返回平台首页</a><button type="button" id="career-logout" hidden>退出登录</button></nav>
    <section id="career-login" hidden>
      <h2>统一登录</h2>
      <form id="login-form">
        <div class="career-grid">
          <label>用户名<input name="username" autocomplete="username" required></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        </div>
        <button type="submit">登录</button>
      </form>
    </section>
    <div id="demo-views" class="career-actions" hidden>
      <button type="button" id="demo-manager">就业指导中心</button>
      <button type="button" id="demo-student">学生视图</button>
    </div>
    <p id="career-message" role="status"></p>
    <section data-manager hidden>
      <h2 id="job-heading">新增岗位</h2>
      <form id="job-form">
        <fieldset id="job-fields" disabled>
          <div class="career-grid">
            <label>岗位名称<input name="title" required maxlength="200"></label>
            <label>行业<input name="industry" required maxlength="120"></label>
            <label>岗位类型
              <select name="job_type">
                <option value="campus">校招</option>
                <option value="internship">实习</option>
              </select>
            </label>
          </div>
          <label>岗位说明<textarea name="description" rows="3" required maxlength="4000"></textarea></label>
          <h3>能力要求</h3>
          <div id="requirements"></div>
          <div class="career-actions">
            <button type="button" id="add-requirement">添加能力项</button>
            <button type="submit" id="save-job">保存为草稿</button>
            <button type="button" id="cancel-edit" hidden>取消编辑</button>
          </div>
        </fieldset>
      </form>
      <p id="jobs-message" role="status"></p>
    </section>
    <section data-manager hidden>
      <h2>岗位目录</h2>
      <div id="jobs" class="modules"></div>
    </section>
    <section data-manager hidden>
      <h2>推荐策略</h2>
      <form id="strategy-form">
        <fieldset id="strategy-fields" disabled>
          <div class="career-grid">
            <label>匹配算法
              <select name="algorithm">
                <option value="pass_and_proximity">加权达标与接近度</option>
                <option value="weighted_pass">加权达标</option>
              </select>
            </label>
            <label>最低推荐分<input name="min_score" type="number" min="0" max="100" step="any" value="50" required></label>
            <label>达标权重<input name="pass_weight" type="number" min="0" max="100" step="any" value="60" required></label>
            <label>接近度权重<input name="proximity_weight" type="number" min="0" max="100" step="any" value="40" required></label>
          </div>
          <label>允许行业（每行一个，留空表示不限）
            <textarea name="allowed_industries" rows="2"></textarea>
          </label>
          <div class="career-grid career-checks">
            <span>允许岗位类型（均未勾选表示不限）</span>
            <label><input name="allowed_job_types" type="checkbox" value="campus"> 校招</label>
            <label><input name="allowed_job_types" type="checkbox" value="internship"> 实习</label>
          </div>
          <button type="submit">保存并生效</button>
        </fieldset>
      </form>
      <p id="strategy-message" role="status"></p>
    </section>
    <section id="outcomes-view" hidden>
      <h2>就业去向统计</h2>
      <form id="outcomes-form">
        <div class="career-grid">
          <label>起始毕业年份<input name="from_year" type="number" min="1900" max="2199" placeholder="不限"></label>
          <label>截止毕业年份<input name="to_year" type="number" min="1900" max="2199" placeholder="不限"></label>
        </div>
        <button type="submit">查询统计</button>
      </form>
      <p id="outcomes-message" role="status"></p>
      <div id="outcomes-tables" class="modules"></div>
    </section>
    <section id="student-view" hidden>
      <h2>我的推荐岗位</h2>
      <form id="recommendation-form">
        <div class="career-grid">
          <label id="demo-student-field" hidden>演示学生
            <select name="demo_student">
              <option value="demo-1">学生 A（含数据库能力）</option>
              <option value="demo-2">学生 B（缺数据库能力）</option>
            </select>
          </label>
          <label>画像周期<input name="term" maxlength="80" placeholder="留空使用最近周期"></label>
          <label>筛选行业<input name="industry" maxlength="120" placeholder="留空表示不限"></label>
          <label>最低匹配分<input name="min_score" type="number" min="0" max="100" step="0.01"></label>
        </div>
        <button type="submit">查看推荐</button>
      </form>
      <p id="recommendation-message" role="status"></p>
      <div id="recommendation-list" class="modules"></div>
    </section>
  </main>
  <template id="requirement-template">
    <div class="career-grid requirement">
      <label>能力标识<input name="competency_code" required maxlength="120" placeholder="例如 programming"></label>
      <label>达标分<input name="threshold" type="number" max="100" step="any" value="80" required></label>
      <label>权重<input name="weight" type="number" max="100" step="any" value="1" required></label>
      <button type="button">移除此项</button>
    </div>
  </template>
  <template id="feedback-template">
    <form>
      <label>意向
        <select name="choice" required>
          <option value="">请选择</option>
          <option value="interested">感兴趣</option>
          <option value="not_interested">不感兴趣</option>
        </select>
      </label>
      <label>反馈原因<textarea name="reason" rows="2" maxlength="2000" required></textarea></label>
      <button type="submit">保存反馈</button>
      <p role="status"></p>
    </form>
  </template>
</body>
</html>
